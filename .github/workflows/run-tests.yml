name: run-tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3']
        laravel: ['13.*', '12.*']
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
            pest: ^4.0
          - laravel: 12.*
            testbench: 10.*
            pest: ^4.0
          - php: '8.5'
            laravel: 13.*
            pest: ^5.0
          - php: '8.4'
            laravel: 13.*
            pest: ^5.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, sqlite, pdo_sqlite, redis, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Create database
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -u root -proot -e 'CREATE DATABASE IF NOT EXISTS laravel_mt_landlord; CREATE DATABASE IF NOT EXISTS laravel_mt_tenant_1; CREATE DATABASE IF NOT EXISTS laravel_mt_tenant_2;'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Download RoadRunner
        run: vendor/bin/rr get-binary --no-config -n
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute tests
        run: vendor/bin/pest
        env:
          DB_PASSWORD: root
